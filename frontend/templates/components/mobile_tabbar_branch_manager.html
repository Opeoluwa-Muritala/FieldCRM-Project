{# Mobile bottom tab bar — Branch Manager #}
{# Tabs: Home · Awaiting · Signoffs · Pipeline · Logout #}

{% set active_tab = active_tab|default('home') %}

{% macro tab_icon(id) %}
<svg class="tab-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <use class="icon-stroke" href="/static/img/icons.svg#icon-{{ id }}-o"/>
  <use class="icon-fill"   href="/static/img/icons.svg#icon-{{ id }}-f"/>
</svg>
{% endmacro %}

<button class="tab-item {% if active_tab == 'home' %}active{% endif %}"
        type="button" data-href="/dashboard" aria-label="Home">
    <span class="tab-icon">{{ tab_icon('home') }}</span>
    <span class="tab-label">Home</span>
</button>

<button class="tab-item {% if active_tab == 'awaiting' %}active{% endif %}"
        type="button" data-href="/awaiting-me" aria-label="Awaiting">
    <span class="tab-icon">{{ tab_icon('awaiting') }}</span>
    <span class="tab-label">Awaiting</span>
</button>

<button class="tab-item {% if active_tab == 'signoffs' %}active{% endif %}"
        type="button" data-href="/pending-signoffs" aria-label="Signoffs">
    <span class="tab-icon">{{ tab_icon('signoffs') }}</span>
    <span class="tab-label">Signoffs</span>
</button>

<button class="tab-item {% if active_tab == 'pipeline' %}active{% endif %}"
        type="button" data-href="/pipeline" aria-label="Pipeline">
    <span class="tab-icon">{{ tab_icon('pipeline') }}</span>
    <span class="tab-label">Pipeline</span>
</button>

<button class="tab-item {% if active_tab == 'new_application' %}active{% endif %}"
        type="button" data-href="/applications/new" aria-label="New loan application">
    <span class="tab-icon" aria-hidden="true">+</span>
    <span class="tab-label">New loan</span>
</button>

<button class="tab-item"
        type="button" data-logout aria-label="Logout">
    <span class="tab-icon">{{ tab_icon('logout') }}</span>
    <span class="tab-label">Logout</span>
</button>
