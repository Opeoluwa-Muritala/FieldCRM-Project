{% if flags %}
<div class="page-card csp-s-1f443539bb77">
    <h3 class="csp-s-0be327428ad4">
        <span class="csp-s-79741bc81f18">⚠</span> Open Compliance Flags
    </h3>
    <ul class="csp-s-840d40c5235e">
        {% for flag in flags %}
            <li class="csp-s-7e8fbd42dfdd">
                <div>
                    <span class="csp-s-23d5150a2306">{{ flag.flag_type|title }}:</span> 
                    {{ flag.flag_label }}
                </div>
                <span class="status-badge csp-s-0a5b48ed21a7">
                    {{ flag.flag_status|replace('_', ' ')|title }}
                </span>
            </li>
        {% endfor %}
    </ul>
</div>
{% endif %}
