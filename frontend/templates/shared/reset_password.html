<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ 'Complete Registration' if invitation else 'Reset Password' }} | FieldCRM</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/login.css?v=20260729">
    <link rel="stylesheet" href="/static/css/csp-utilities.css?v=20260729">
    <script defer src="/static/js/csp-styles.js?v=20260729"></script>
    <script defer src="/static/js/csrf.js?v=20260815"></script>
</head>
<body>
    <div class="login-split-container">
        <div class="brand-panel">
            <header class="brand-header">
                <div class="brand-logo-wrapper">
                    <a href="/dashboard" class="brand-home-link" aria-label="Go to dashboard"><img class="brand-logo-img" src="{{ brand_logo_white }}" alt="Mainstreet Microfinance Bank" loading="lazy"></a>
                </div>
            </header>
        </div>

        <div class="form-panel registration-panel">
            <div class="form-shell registration-form-shell">
                <div class="login-title-area registration-header">
                    <h1 class="login-title">{{ 'Complete Registration' if invitation else 'Reset Password' }}</h1>
                    <p class="login-subtitle">{{ 'Set a password to activate your FieldCRM account.' if invitation else 'Enter your new password below.' }}</p>
                </div>

                {% if error %}
                <div class="csp-s-d8190cee8853">{{ error }}</div>
                {% endif %}

                <form method="POST" action="/reset-password">
                    <input type="hidden" name="token" value="{{ token or '' }}">
                    <input type="hidden" name="invitation" value="{{ 'true' if invitation else 'false' }}">
                    <div class="form-group">
                        <label class="form-label" for="new_password">New Password</label>
                        <div class="input-container">
                            <input class="form-input" id="new_password" name="new_password" type="password" placeholder="At least 12 characters" autocomplete="new-password" required minlength="12" maxlength="128">
                        </div>
                    </div>
                    <div class="form-group csp-s-b6d781cbbc10">
                        <label class="form-label" for="confirm_password">Confirm Password</label>
                        <div class="input-container">
                            <input class="form-input" id="confirm_password" name="confirm_password" type="password" placeholder="Confirm new password" autocomplete="new-password" required minlength="12" maxlength="128">
                        </div>
                    </div>
                    <button class="login-btn csp-s-76977cc9f242" type="submit">
                        <span>{{ 'Activate Account' if invitation else 'Reset Password' }}</span>
                    </button>
                    <div class="csp-s-7a4b0663cf4f">
                        <a href="/login" class="csp-s-901e32c9c693">&larr; Back to Sign In</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
