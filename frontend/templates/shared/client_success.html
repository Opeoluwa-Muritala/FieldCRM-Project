<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Submitted | FieldCRM</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/dashboard.css?v=20260729">
    <link rel="stylesheet" href="/static/css/csp-utilities.css?v=20260729">
    <script defer src="/static/js/csp-styles.js?v=20260729"></script>
    <style nonce="{{ csp_nonce }}">
        body {
            background-color: var(--bg-secondary, #f3f4f6);
            font-family: 'Montserrat', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .success-card {
            background: #fff;
            max-width: 520px;
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            padding: 48px 32px;
            text-align: center;
            border-top: 4px solid var(--accent-success, #10b981);
        }
        .success-icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--accent-success, #10b981);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 24px;
        }
    </style>
</head>
<body data-role="loan_officer">
    <div class="success-card">
        <div class="success-icon">
            ✓
        </div>
        <a href="/dashboard" class="brand-home-link" aria-label="Go to dashboard"><img class="brand-logo csp-s-24e77223e70f" src="{{ brand_logo_black }}" alt="Mainstreet Microfinance Bank Logo"></a>
        <h1 class="csp-s-a0ea3eaf53af">Submission Complete</h1>
        <p class="csp-s-9934d2086285">
            Thank you! Your loan application has been successfully submitted to <strong>{{ officer_name }}</strong>. 
            We have begun processing your details and will contact you shortly.
        </p>
        <div class="csp-s-3cd1e9b91cc3">
            You can safely close this browser window.
        </div>
    </div>
</body>
</html>
