<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Application Intake | FieldCRM</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/dashboard.css?v=20260729">
    <link rel="stylesheet" href="/static/css/csp-utilities.css?v=20260729">
    <script defer src="/static/js/csp-styles.js?v=20260729"></script>
    <style nonce="{{ csp_nonce }}">
        body {
            background-color: var(--bg-secondary, #f3f4f6);
            font-family: 'Montserrat', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .start-container {
            background: #fff;
            max-width: 600px;
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            padding: 40px 32px;
            box-sizing: border-box;
        }
        .header-section {
            text-align: center;
            margin-bottom: 32px;
        }
        .brand-logo {
            max-height: 48px;
            margin-bottom: 16px;
        }
        .officer-banner {
            background-color: var(--color-brand-tint, rgba(107, 63, 160, 0.08));
            border: 0.5px solid var(--color-brand-light, rgba(107, 63, 160, 0.2));
            color: var(--color-brand-deep, #3a1660);
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 28px;
            text-align: center;
        }
    </style>
</head>
<body data-role="loan_officer">
    <div class="start-container">
        <div class="header-section">
            <a href="/dashboard" class="brand-home-link" aria-label="Go to dashboard"><img class="brand-logo" src="{{ brand_logo_black }}" alt="Mainstreet Microfinance Bank Logo"></a>
            <h1 class="csp-s-309c2ab9106c">Loan Application Intake</h1>
            <p class="csp-s-e561b77bd7e2">Complete your borrower profile registration.</p>
        </div>

        <div class="officer-banner">
            👤 Sending Officer: <strong>{{ officer_name }}</strong> (Relationship Officer)
        </div>

        <form action="/share-intake/{{ token }}/start" method="POST" id="startForm">
            <!-- Full Name -->
            <div class="form-group csp-s-fec3619ed0de">
                <label class="field-label" for="fullName">Your Full Name <span class="csp-s-77e237a218c9">*</span></label>
                <input type="text" id="fullName" name="full_name" class="field-input" placeholder="e.g. Grace Omowunmi" required>
            </div>

            <!-- Customer Type selection -->
            <div class="csp-s-fec3619ed0de">
                <label class="field-label csp-s-c804002a4185">Customer Status <span class="csp-s-77e237a218c9">*</span></label>
                <div class="csp-s-a666bf8aaea0">
                    <div class="toggle-option-card csp-s-554984cc2bfa" id="custTypeNew" data-customer-type="new">
                        <input type="radio" name="customer_type" value="new" id="radioNew" required class="csp-s-d0466aa33fa8">
                        <strong class="csp-s-6e8ff20aada1">New Customer</strong>
                        <span class="csp-s-c029905cd705">First-time borrower profile</span>
                    </div>
                    <div class="toggle-option-card csp-s-554984cc2bfa" id="custTypeExisting" data-customer-type="existing">
                        <input type="radio" name="customer_type" value="existing" id="radioExisting" class="csp-s-d0466aa33fa8">
                        <strong class="csp-s-6e8ff20aada1">Existing Customer</strong>
                        <span class="csp-s-c029905cd705">Already registered / past loan history</span>
                    </div>
                </div>
            </div>

            <!-- Loan Category grid -->
            <div class="csp-s-e8a8a9c051f6">
                <label class="field-label csp-s-c804002a4185">Loan Category <span class="csp-s-77e237a218c9">*</span></label>
                <div class="csp-s-4424a8a886a2">
                    <div class="toggle-option-card csp-s-97b242a52b2d" id="loanEnterprise" data-loan-type="enterprise">
                        <input type="radio" name="loan_type" value="enterprise" id="radioEnterprise" required class="csp-s-d0466aa33fa8">
                        <strong class="csp-s-e5e1736b956e">Enterprise Loan</strong>
                    </div>
                    <div class="toggle-option-card csp-s-97b242a52b2d" id="loanMsef" data-loan-type="msef">
                        <input type="radio" name="loan_type" value="msef" id="radioMsef" class="csp-s-d0466aa33fa8">
                        <strong class="csp-s-e5e1736b956e">MSEF</strong>
                    </div>
                    <div class="toggle-option-card csp-s-97b242a52b2d" id="loanPayee" data-loan-type="payee">
                        <input type="radio" name="loan_type" value="payee" id="radioPayee" class="csp-s-d0466aa33fa8">
                        <strong class="csp-s-e5e1736b956e">PAYEE</strong>
                    </div>
                    <div class="toggle-option-card csp-s-97b242a52b2d" id="loanOther" data-loan-type="other">
                        <input type="radio" name="loan_type" value="other" id="radioOther" class="csp-s-d0466aa33fa8">
                        <strong class="csp-s-e5e1736b956e">Other Option</strong>
                    </div>
                </div>
            </div>

            <button type="submit" id="startBtn" class="btn-primary-filled csp-s-cc22c4b46188" disabled>
                Start Form Intake &rarr;
            </button>
        </form>
    </div>

    <script nonce="{{ csp_nonce }}">
        function selectCustType(type) {
            document.getElementById('radioNew').checked = (type === 'new');
            document.getElementById('radioExisting').checked = (type === 'existing');
            
            document.getElementById('custTypeNew').classList.toggle('selected', type === 'new');
            document.getElementById('custTypeExisting').classList.toggle('selected', type === 'existing');
            validateForm();
        }

        function selectLoanType(type) {
            document.getElementById('radioEnterprise').checked = (type === 'enterprise');
            document.getElementById('radioMsef').checked = (type === 'msef');
            document.getElementById('radioPayee').checked = (type === 'payee');
            document.getElementById('radioOther').checked = (type === 'other');

            document.getElementById('loanEnterprise').classList.toggle('selected', type === 'enterprise');
            document.getElementById('loanMsef').classList.toggle('selected', type === 'msef');
            document.getElementById('loanPayee').classList.toggle('selected', type === 'payee');
            document.getElementById('loanOther').classList.toggle('selected', type === 'other');
            validateForm();
        }

        function validateForm() {
            const nameFilled = document.getElementById('fullName').value.trim().length > 0;
            const custTypeChecked = document.getElementById('radioNew').checked || document.getElementById('radioExisting').checked;
            const loanTypeChecked = document.getElementById('radioEnterprise').checked || document.getElementById('radioMsef').checked || document.getElementById('radioPayee').checked || document.getElementById('radioOther').checked;
            
            document.getElementById('startBtn').disabled = !(nameFilled && custTypeChecked && loanTypeChecked);
        }

        document.getElementById('fullName').addEventListener('input', validateForm);
        document.querySelectorAll('[data-customer-type]').forEach((card) => {
            card.addEventListener('click', () => selectCustType(card.dataset.customerType));
        });
        document.querySelectorAll('[data-loan-type]').forEach((card) => {
            card.addEventListener('click', () => selectLoanType(card.dataset.loanType));
        });
    </script>
</body>
</html>
