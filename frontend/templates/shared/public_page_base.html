<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2E0052">
    <title>{% block title %}FieldCRM{% endblock %}</title>
    <meta name="description" content="{% block description %}FieldCRM by Mainstreet Microfinance Bank.{% endblock %}">
    <link rel="icon" href="/static/icons/favicon.svg?v=20260813" type="image/svg+xml">
    <link rel="icon" href="/static/icons/favicon-32.png?v=20260813" sizes="32x32" type="image/png">
    <link rel="shortcut icon" href="/static/icons/favicon.ico?v=20260813">
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/home.css?v=20260902-public-system-3">
    <script defer src="/static/js/public-site.js?v=20260902-scroll-motion"></script>
</head>
<body>
<a class="skip-link" href="#main-content">Skip to content</a>
<header class="site-header">
    <a class="product-brand" href="/" aria-label="FieldCRM home"><img src="/static/img/MMFB Logo Black.png" alt="Mainstreet Microfinance Bank"><span>FieldCRM</span></a>
    <nav aria-label="Public navigation"><a href="/">Home</a><a href="/platform">Platform</a><a href="/#workflow">Workflow</a><a href="/#mobile-app">Mobile</a><a href="/controls">Controls</a><a href="/#help">Help</a></nav>
    <a class="button button-dark header-login" href="/login">Staff login <span aria-hidden="true">↗</span></a>
</header>
<main id="main-content">{% block content %}{% endblock %}</main>
<footer class="site-footer"><img src="/static/img/MMFB logo White.png" alt="Mainstreet Microfinance Bank"><p>&copy; 2026 Mainstreet Microfinance Bank Limited. All rights reserved.</p><nav aria-label="Footer navigation"><a href="/">Home</a><a href="/platform">Platform</a><a href="/controls">Controls</a><a href="/privacy">Privacy</a><a href="/terms">Terms</a><a href="/login">Staff login</a></nav></footer>
</body>
</html>
